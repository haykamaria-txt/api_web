<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Laboratórios - Check-in</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <span class="eyebrow">Controle de acesso</span>
        <h1>Check-in</h1>
      </div>
      <a class="button button-secondary" href="index.html" data-logout>Sair</a>
    </header>

    <div class="app-layout">
      <aside class="sidebar">
        <nav class="side-nav" data-nav></nav>
      </aside>

      <main class="content">
        <section class="grid-two">
          <article class="card">
            <h2>Registrar check-in</h2>
            <p class="section-text">
              O professor logado sera associado automaticamente ao registro.
            </p>
            <form class="form-grid" id="checkin-form">
              <label>
                Laboratório
                <select id="checkin-laboratorio" required></select>
              </label>

              <button class="button button-primary" type="submit">Registrar check-in</button>
            </form>
          </article>

          <article class="card">
            <h2>Registro de entrada</h2>
            <ul class="simple-list">
              <li>Selecione o laboratório utilizado.</li>
              <li>O sistema salva data, hora e professor automaticamente.</li>
            </ul>
          </article>
        </section>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
